name: CI and Deploy to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    name: Verify (Lint, Test, Build)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Verify provisioned browser
        shell: bash
        run: |
          set -euo pipefail
          CHROME_CANDIDATE=""
          for candidate in "/usr/bin/google-chrome-stable" "/usr/bin/google-chrome" "${CHROME_BIN:-}"; do
            if [ -n "$candidate" ] && [ -x "$candidate" ]; then
              CHROME_CANDIDATE="$candidate"
              break
            fi
          done
          if [ -z "$CHROME_CANDIDATE" ]; then
            echo "::error::Provisioned Google Chrome binary not found on runner."
            exit 1
          fi
          echo "CHROME_PATH=$CHROME_CANDIDATE" >> "$GITHUB_ENV"
          echo "Selected browser binary: $CHROME_CANDIDATE"
          ls -la "$CHROME_CANDIDATE"
          "$CHROME_CANDIDATE" --version

      - name: Install dependencies
        run: npm ci

      - name: Run lint checks
        run: npm run lint

      - name: Execute automated unit tests
        run: npm test

      - name: Build production bundle
        run: npm run build
        env:
          NODE_ENV: production

      - name: Upload production bundle
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: dist-bundle
          path: ./dist
          retention-days: 1

  deploy:
    name: Deploy to GitHub Pages
    needs: verify
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download production bundle
        uses: actions/download-artifact@v4
        with:
          name: dist-bundle
          path: ./dist

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
